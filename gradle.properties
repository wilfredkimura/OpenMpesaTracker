# JVM memory settings for running the Gradle daemon smoothly
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX libraries instead of legacy support libraries
android.useAndroidX=true

# Enable parallel compilation to make builds faster
org.gradle.parallel=true

# Enable caching across builds
org.gradle.caching=true

# Kotlin code style specification
kotlin.code.style=official

# Use JDK 21 from Android Studio
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
